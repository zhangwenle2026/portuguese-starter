// ============ UTILS ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function speak(text, lang) {
  if (!window.speechSynthesis) { showToast('浏览器不支持语音合成'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'pt-BR';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function getTag(id) { return tags[id] || ''; }
function setTag(id, t) {
  const old = tags[id] || '';
  tags[id] = (old === t) ? '' : t;
  lsSave('tags', tags);
  markToday(id);
  refreshDashboard();
}
function markToday(id) {
  todaySet.add(id);
  lsSave('today_' + new Date().toDateString(), [...todaySet]);
}

// ============ DASHBOARD ============
function refreshDashboard() {
  const all = [...VOCAB, ...GREET, ...SCENE, ...DIALOGS];
  const total = all.length;
  const mastered = all.filter(x => tags[x.id] === '✅').length;
  const starred = all.filter(x => tags[x.id] === '⭐').length;
  const today = todaySet.size;
  const rate = total > 0 ? Math.round(mastered / total * 100) : 0;
  document.getElementById('d-total').textContent = total;
  document.getElementById('d-mastered').textContent = mastered;
  document.getElementById('d-starred').textContent = starred;
  document.getElementById('d-today').textContent = today;
  document.getElementById('d-rate').textContent = rate + '%';
}

function updateStats(ns, data) {
  const total = data.length;
  const mastered = data.filter(x => tags[x.id] === '✅').length;
  const starred = data.filter(x => tags[x.id] === '⭐').length;
  const crossed = data.filter(x => tags[x.id] === '✗').length;
  const el = document.getElementById(ns + '-st');
  if (el) el.innerHTML = `<span class="sbadge bt">总计 ${total}</span><span class="sbadge bstar">⭐ ${starred}</span><span class="sbadge bchk">✅ ${mastered}</span><span class="sbadge bx">✗ ${crossed}</span>`;
  const mf = document.getElementById(ns + '-mf');
  if (mf) mf.style.width = (total > 0 ? Math.round(mastered / total * 100) : 0) + '%';
}

// ============ TABS ============
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

// ============ CARDS RENDER ============
function getVisibleVocab() {
  const f = filters.vocab;
  const q = searches.vocab.toLowerCase();
  return VOCAB.filter(v => {
    const matchF = f === 'all' || v.cat === f || (f === '⭐' && tags[v.id] === '⭐') || (f === '✅' && tags[v.id] === '✅') || (f === '✗' && tags[v.id] === '✗');
    const matchQ = !q || v.pt.toLowerCase().includes(q) || v.cn.includes(q);
    return matchF && matchQ;
  });
}
function getVisibleGreet() {
  const f = filters.greet;
  const q = searches.greet.toLowerCase();
  return GREET.filter(v => {
    const matchF = f === 'all' || (f === '⭐' && tags[v.id] === '⭐') || (f === '✅' && tags[v.id] === '✅');
    const matchQ = !q || v.pt.toLowerCase().includes(q) || v.cn.includes(q);
    return matchF && matchQ;
  });
}
function getVisibleScene() {
  const f = filters.scene;
  const q = searches.scene.toLowerCase();
  return SCENE.filter(v => {
    const matchF = f === 'all' || (f === '⭐' && tags[v.id] === '⭐') || (f === '✅' && tags[v.id] === '✅');
    const matchQ = !q || v.pt.toLowerCase().includes(q) || v.cn.includes(q);
    return matchF && matchQ;
  });
}

function renderVocabCard(v, lm) {
  const tag = tags[v.id] || '';
  const flipped = flippedCards.has(v.id) ? ' flipped' : '';
  const lmClass = lm === 1 ? ' lm1' : '';
  return `<div class="fc${flipped}${lmClass}" id="fc-${v.id}" onclick="flipCard('${v.id}')">
    <div class="ci">
      <div class="cf">
        <span class="ccat">${v.cat}</span>
        <div class="cpt">${esc(v.pt)}</div>
        <div class="cacts" onclick="event.stopPropagation()">
          <button class="spkbtn" onclick="speak('${esc(v.pt)}','pt-BR')" title="发音">🔈</button>
          <button class="tbtn tstar ${tag==='⭐'?'active':''}" onclick="setTag('${v.id}','⭐');renderVocab()">⭐</button>
          <button class="tbtn tcheck ${tag==='✅'?'active':''}" onclick="setTag('${v.id}','✅');renderVocab()">✅</button>
          <button class="tbtn tcross ${tag==='✗'?'active':''}" onclick="setTag('${v.id}','✗');renderVocab()">✗</button>
        </div>
      </div>
      <div class="cb">
        <div class="ccn">${esc(v.cn)}</div>
        <div class="chint" id="hint-${v.id}">🗣️ ${esc(v.hint)}</div>
        <button class="hint-btn" id="hbtn-${v.id}" onclick="event.stopPropagation();showHint('${v.id}')">👁️ 查看谐音</button>
      </div>
    </div>
  </div>`;
}

function renderSentCard(v, lm, ns) {
  const tag = tags[v.id] || '';
  const flipped = flippedCards.has(v.id) ? ' flipped' : '';
  const lmClass = lm === 1 ? ' lm1' : '';
  return `<div class="fc sc${flipped}${lmClass}" id="fc-${v.id}" onclick="flipCard('${v.id}')">
    <div class="ci">
      <div class="cf">
        <div class="cpt" style="font-size:.92em">${esc(v.pt)}</div>
        <div class="cacts" onclick="event.stopPropagation()">
          <button class="spkbtn" onclick="speak('${esc(v.pt).replace(/'/g,'\\x27')}','pt-BR')" title="发音">🔈</button>
          <button class="tbtn tstar ${tag==='⭐'?'active':''}" onclick="setTag('${v.id}','⭐');render${ns}()">⭐</button>
          <button class="tbtn tcheck ${tag==='✅'?'active':''}" onclick="setTag('${v.id}','✅');render${ns}()">✅</button>
          <button class="tbtn tcross ${tag==='✗'?'active':''}" onclick="setTag('${v.id}','✗');render${ns}()">✗</button>
        </div>
      </div>
      <div class="cb">
        <div class="ccn">${esc(v.cn)}</div>
        <div class="cscene">📍 ${esc(v.scene)}</div>
      </div>
    </div>
  </div>`;
}

function renderVocab() {
  const lm = listenModes[0];
  const data = getVisibleVocab();
  document.getElementById('vocab-grid').innerHTML = data.map(v => renderVocabCard(v, lm)).join('');
  updateStats('vocab', VOCAB);
  refreshDashboard();
}

function renderGreet() {
  const lm = listenModes[1];
  const data = getVisibleGreet();
  document.getElementById('greet-grid').innerHTML = data.map(v => renderSentCard(v, lm, 'Greet')).join('');
  updateStats('greet', GREET);
  refreshDashboard();
}

function renderScene() {
  const lm = listenModes[2];
  const data = getVisibleScene();
  document.getElementById('scene-grid').innerHTML = data.map(v => renderSentCard(v, lm, 'Scene')).join('');
  updateStats('scene', SCENE);
  refreshDashboard();
}

// ============ DIALOG RENDER ============
function getVisibleDialogs() {
  const f = filters.dialog;
  const q = searches.dialog.toLowerCase();
  return DIALOGS.filter(d => {
    const matchF = f === 'all' || (f === '⭐' && tags[d.id] === '⭐') || (f === '✅' && tags[d.id] === '✅');
    const matchQ = !q || d.title.includes(q) || d.pt.toLowerCase().includes(q) || d.cn.includes(q);
    return matchF && matchQ;
  });
}

function renderDialogs() {
  const data = getVisibleDialogs();
  document.getElementById('dialog-list').innerHTML = data.map((d, i) => renderDialogCard(d, i)).join('');
  updateDialogStats();
  refreshDashboard();
}

function renderDialogCard(d, i) {
  const tag = tags[d.id] || '';
  const ptLines = d.pt.split('\n').map(l => `<div>${esc(l)}</div>`).join('');
  const cnLines = d.cn.split('\n').map(l => `<div>${esc(l)}</div>`).join('');
  return `<div class="dc" id="dc-${d.id}">
    <div class="dtitle">
      <div class="dnum">${i+1}</div>
      <span>🎭 ${esc(d.title)}</span>
      <span style="font-size:.78em;color:#666;font-weight:400">${esc(d.sub)}</span>
      <div class="dtag-area" onclick="event.stopPropagation()">
        <button class="tbtn tstar ${tag==='⭐'?'active':''}" onclick="setTag('${d.id}','⭐');renderDialogs()">⭐</button>
        <button class="tbtn tcheck ${tag==='✅'?'active':''}" onclick="setTag('${d.id}','✅');renderDialogs()">✅</button>
        <button class="tbtn tcross ${tag==='✗'?'active':''}" onclick="setTag('${d.id}','✗');renderDialogs()">✗</button>
      </div>
    </div>
    <div class="dbody">
      <div class="dpt"><div style="font-size:.7em;font-weight:700;color:#009c3b;margin-bottom:5px">🇧🇷 葡语</div><div class="dline">${ptLines}</div></div>
      <div class="dcn"><div style="font-size:.7em;font-weight:700;color:#002776;margin-bottom:5px">🇨🇳 中文</div><div class="dline">${cnLines}</div></div>
    </div>
    <div class="dctrl">
      <button class="playbtn" id="pb-${d.id}" onclick="playDialog('${d.id}')">🔈 朗读</button>
      <button class="pausebtn" id="ppb-${d.id}" onclick="pauseDialog('${d.id}')">⏸ 暂停</button>
      <div class="tl" id="tl-${d.id}" onclick="seekDialog(event,'${d.id}')">
        <div class="tlf" id="tlf-${d.id}" style="width:0%"></div>
      </div>
      <div class="tdisp" id="tdisp-${d.id}">0.0s</div>
    </div>
  </div>`;
}

function updateDialogStats() {
  const total = DIALOGS.length;
  const mastered = DIALOGS.filter(d => tags[d.id] === '✅').length;
  const starred = DIALOGS.filter(d => tags[d.id] === '⭐').length;
  const el = document.getElementById('dialog-st');
  if (el) el.innerHTML = `<span class="sbadge bt">总计 ${total}</span><span class="sbadge bstar">⭐ ${starred}</span><span class="sbadge bchk">✅ ${mastered}</span>`;
}

// ============ DIALOG AUDIO ============
let activeDialog = null;

function playDialog(id) {
  if (!window.speechSynthesis) { showToast('浏览器不支持语音'); return; }
  if (activeDialog && activeDialog !== id) stopDialog(activeDialog);
  const d = DIALOGS.find(x => x.id === id);
  if (!d) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(d.pt.replace(/—/g, ' '));
  u.lang = 'pt-BR'; u.rate = 0.82;
  activeDialog = id;
  const pb = document.getElementById('pb-' + id);
  const ppb = document.getElementById('ppb-' + id);
  const tlf = document.getElementById('tlf-' + id);
  const tdisp = document.getElementById('tdisp-' + id);
  if (pb) pb.classList.add('playing');
  if (ppb) ppb.classList.add('vis');
  let est = d.pt.length / 12;
  let elapsed = 0;
  if (tlTimers[id]) clearInterval(tlTimers[id]);
  tlTimers[id] = setInterval(() => {
    if (!window.speechSynthesis.speaking) { clearInterval(tlTimers[id]); return; }
    if (!window.speechSynthesis.paused) elapsed += 0.1;
    const pct = Math.min(100, elapsed / est * 100);
    if (tlf) tlf.style.width = pct + '%';
    if (tdisp) tdisp.textContent = elapsed.toFixed(1) + 's';
  }, 100);
  u.onend = () => {
    clearInterval(tlTimers[id]);
    if (tlf) tlf.style.width = '100%';
    if (pb) pb.classList.remove('playing');
    if (ppb) ppb.classList.remove('vis');
    activeDialog = null;
  };
  audioState[id] = { utterance: u, paused: false };
  window.speechSynthesis.speak(u);
  markToday(id);
}

function pauseDialog(id) {
  if (!audioState[id]) return;
  if (window.speechSynthesis.paused) {
    window.speechSynthesis.resume();
    const ppb = document.getElementById('ppb-' + id);
    if (ppb) ppb.textContent = '⏸ 暂停';
  } else {
    window.speechSynthesis.pause();
    const ppb = document.getElementById('ppb-' + id);
    if (ppb) ppb.textContent = '▶️ 继续';
  }
}

function stopDialog(id) {
  window.speechSynthesis.cancel();
  if (tlTimers[id]) clearInterval(tlTimers[id]);
  const pb = document.getElementById('pb-' + id);
  const ppb = document.getElementById('ppb-' + id);
  const tlf = document.getElementById('tlf-' + id);
  if (pb) pb.classList.remove('playing');
  if (ppb) ppb.classList.remove('vis');
  if (tlf) tlf.style.width = '0%';
  audioState[id] = null;
  activeDialog = null;
}

function seekDialog(e, id) {
  const d = DIALOGS.find(x => x.id === id);
  if (!d) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const est = d.pt.length / 12;
  showToast('时间轴: ' + (pct * 100).toFixed(0) + '%（浏览器TTS不支持精确跳转）');
}

// ============ FLIP ============
function showHint(id){
  var el=document.getElementById('hint-'+id);
  var btn=document.getElementById('hbtn-'+id);
  if(el) el.classList.add('revealed');
  if(btn) btn.style.display='none';
}
function flipCard(id) {
  if (flippedCards.has(id)) { flippedCards.delete(id);
    var hel=document.getElementById('hint-'+id);
    var hbtn=document.getElementById('hbtn-'+id);
    if(hel) hel.classList.remove('revealed');
    if(hbtn) hbtn.style.display='';
  } else { flippedCards.add(id); markToday(id); }
  const el = document.getElementById('fc-' + id);
  if (el) el.classList.toggle('flipped', flippedCards.has(id));
  refreshDashboard();
}
function flipAll(ns) {
  const dataMap = { vocab: VOCAB, greet: GREET, scene: SCENE };
  const data = dataMap[ns] || [];
  const allFlipped = data.every(v => flippedCards.has(v.id));
  data.forEach(v => { if (allFlipped) flippedCards.delete(v.id); else flippedCards.add(v.id); });
  const renderFn = { vocab: renderVocab, greet: renderGreet, scene: renderScene };
  if (renderFn[ns]) renderFn[ns]();
}

// ============ FILTER / SEARCH ============
function filterCards(ns, q) {
  searches[ns] = q;
  const renderFn = { vocab: renderVocab, greet: renderGreet, scene: renderScene };
  if (renderFn[ns]) renderFn[ns]();
}
function filterDialogs(q) {
  searches.dialog = q;
  renderDialogs();
}
function setFilter(ns, val, btn) {
  filters[ns] = val;
  const panel = btn.closest('.tab-panel') || btn.closest('.content');
  const toolbar = btn.parentNode;
  toolbar.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const renderFn = { vocab: renderVocab, greet: renderGreet, scene: renderScene };
  if (renderFn[ns]) renderFn[ns]();
}
function setDFilter(val, btn) {
  filters.dialog = val;
  btn.parentNode.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDialogs();
}

// ============ LISTEN MODE ============
function toggleListen(tabIdx) {
  const states = ['', 'reveal-pt', 'reveal-all'];
  const cur = listenModes[tabIdx];
  if (states[cur]) listenModes[tabIdx] = (cur + 1) % 3;
  else listenModes[tabIdx] = (cur + 1) % 3;
  const btn = document.getElementById('lbtn' + tabIdx);
  if (btn) {
    btn.textContent = LISTEN_LABELS[listenModes[tabIdx]];
    btn.className = 'lbtn' + (listenModes[tabIdx] === 1 ? ' m1' : listenModes[tabIdx] === 2 ? ' m2' : '');
  }
  const renderFns = [renderVocab, renderGreet, renderScene];
  if (renderFns[tabIdx]) renderFns[tabIdx]();
}

// ============ BATCH ============
function batchTag(ns, t) {
  const dataMap = { vocab: VOCAB, greet: GREET, scene: SCENE };
  const data = dataMap[ns] || [];
  data.forEach(v => { tags[v.id] = t; });
  lsSave('tags', tags);
  const renderFn = { vocab: renderVocab, greet: renderGreet, scene: renderScene };
  if (renderFn[ns]) renderFn[ns]();
  showToast('已批量标记 ' + t);
  refreshDashboard();
}
function batchClear(ns) {
  const dataMap = { vocab: VOCAB, greet: GREET, scene: SCENE };
  const data = dataMap[ns] || [];
  data.forEach(v => { delete tags[v.id]; });
  lsSave('tags', tags);
  const renderFn = { vocab: renderVocab, greet: renderGreet, scene: renderScene };
  if (renderFn[ns]) renderFn[ns]();
  showToast('已清除标签');
  refreshDashboard();
}

// ============ EXPORT / IMPORT ============
function exportProgress() {
  const data = { tags, date: new Date().toISOString(), version: '20260329' };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pt_progress_' + new Date().toLocaleDateString('zh-CN').replace(/\//g,'-') + '.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('进度已导出！');
}
function importProgress(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.tags) {
        tags = data.tags;
        lsSave('tags', tags);
        renderVocab(); renderGreet(); renderScene(); renderDialogs();
        refreshDashboard();
        showToast('进度已导入！');
      } else { showToast('文件格式错误'); }
    } catch(err) { showToast('导入失败: ' + err.message); }
  };
  r.readAsText(file);
  e.target.value = '';
}
function resetProgress() {
  if (!confirm('确定重置所有学习进度？')) return;
  tags = {};
  lsSave('tags', tags);
  todaySet = new Set();
  lsSave('today_' + new Date().toDateString(), []);
  renderVocab(); renderGreet(); renderScene(); renderDialogs();
  refreshDashboard();
  showToast('进度已重置');
}

// ============ ESCAPE ============
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============ INIT ============
function init() {
  renderVocab();
  renderGreet();
  renderScene();
  renderDialogs();
  refreshDashboard();
}
init();
